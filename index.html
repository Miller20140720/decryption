<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解密挑战 · Miller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        /* ============ 主题变量 ============ */
        :root {
            /* 夜间模式（默认） */
            --bg-gradient-1: #0b0f1c;
            --bg-gradient-2: #1a1f2f;
            --container-bg: rgba(18, 24, 38, 0.85);
            --container-border: rgba(100, 160, 255, 0.2);
            --container-shadow: rgba(0, 0, 0, 0.8);
            --url-bg: rgba(0, 0, 0, 0.3);
            --url-color: #7f8fa6;
            --url-border: #2a3448;
            --badge-bg-1: #1e2b4a;
            --badge-bg-2: #0f1628;
            --badge-border: #3e5a8a;
            --badge-color: #b7d0ff;
            --question-area-bg: #0b101b;
            --question-area-border: #26324a;
            --question-text-bg: #111826;
            --question-text-border: #2c3e5e;
            --question-text-color: #e8f0ff;
            --input-bg: #0d1422;
            --input-border: #26344e;
            --input-color: #e8f0ff;
            --input-placeholder: #4e6180;
            --input-focus-bg: #0e1628;
            --reset-border: #2f405e;
            --reset-color: #9bb1d0;
            --reset-hover-bg: #1b2335;
            --reset-hover-border: #4c6a97;
            --reset-hover-color: #cddfff;
            --footer-border: #1f2a3c;
            --footer-color: #3c4c66;
            --toggle-bg: rgba(0, 0, 0, 0.3);
            --toggle-border: #2a3448;
            --toggle-color: #b7d0ff;
        }

        /* 白天模式 */
        body.light-mode {
            --bg-gradient-1: #e8eefc;
            --bg-gradient-2: #d4e0f7;
            --container-bg: rgba(255, 255, 255, 0.9);
            --container-border: rgba(80, 130, 220, 0.3);
            --container-shadow: rgba(80, 110, 180, 0.25);
            --url-bg: rgba(255, 255, 255, 0.8);
            --url-color: #4a5878;
            --url-border: #b6c6e0;
            --badge-bg-1: #d6e4ff;
            --badge-bg-2: #b8cdf5;
            --badge-border: #8bb0e8;
            --badge-color: #1a3a7a;
            --question-area-bg: #f5f8ff;
            --question-area-border: #c8d6ef;
            --question-text-bg: #ffffff;
            --question-text-border: #c8d6ef;
            --question-text-color: #1a2b4a;
            --input-bg: #ffffff;
            --input-border: #b8c8e5;
            --input-color: #1a2b4a;
            --input-placeholder: #8095b8;
            --input-focus-bg: #ffffff;
            --reset-border: #b8c8e5;
            --reset-color: #4a5878;
            --reset-hover-bg: #e0e9f8;
            --reset-hover-border: #8bb0e8;
            --reset-hover-color: #1a3a7a;
            --footer-border: #c8d6ef;
            --footer-color: #8095b8;
            --toggle-bg: rgba(255, 255, 255, 0.8);
            --toggle-border: #b6c6e0;
            --toggle-color: #1a3a7a;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.4s ease;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px var(--container-shadow),
                        0 0 0 1px var(--container-border),
                        inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid var(--container-border);
            transition: all 0.4s ease;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .site-url {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: var(--url-color);
            font-weight: 400;
            text-transform: lowercase;
            background: var(--url-bg);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--url-border);
            transition: all 0.3s ease;
        }

        /* 主题切换按钮 */
        .theme-toggle {
            cursor: pointer;
            font-size: 1rem;
            background: var(--toggle-bg);
            color: var(--toggle-color);
            border: 1px solid var(--toggle-border);
            padding: 0.35rem 0.9rem;
            border-radius: 30px;
            transition: all 0.3s ease;
            user-select: none;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .theme-toggle:hover {
            transform: scale(1.06);
            box-shadow: 0 0 12px rgba(110, 168, 255, 0.35);
        }

        .level-badge {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--badge-color);
            background: linear-gradient(135deg, var(--badge-bg-1), var(--badge-bg-2));
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            border: 1px solid var(--badge-border);
            box-shadow: 0 0 12px rgba(80, 150, 255, 0.2);
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .level-badge span {
            color: var(--badge-color);
            font-weight: 800;
            margin-right: 6px;
            text-shadow: 0 0 8px rgba(110, 168, 255, 0.6);
        }

        .question-area {
            background: var(--question-area-bg);
            border-radius: 1.8rem;
            padding: 2rem 2rem;
            margin: 1.5rem 0 2rem;
            border: 1px solid var(--question-area-border);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.25), 0 8px 20px -8px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .question-text {
            color: var(--question-text-color);
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.4;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--question-text-bg);
            border-radius: 1.5rem;
            padding: 1.8rem 1.5rem;
            border: 1px solid var(--question-text-border);
            letter-spacing: 4px;
            text-shadow: 0 0 24px rgba(110, 168, 255, 0.3);
            word-break: break-word;
            transition: all 0.3s ease;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1.2rem;
        }

        .answer-input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1.2rem;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 60px;
            color: var(--input-color);
            outline: none;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .answer-input::placeholder {
            color: var(--input-placeholder);
            font-weight: 400;
            font-style: italic;
        }

        .answer-input:focus {
            border-color: #4b7bec;
            box-shadow: 0 0 0 4px rgba(75, 123, 236, 0.25), 0 0 18px rgba(30, 58, 138, 0.6);
            background: var(--input-focus-bg);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn {
            border: none;
            padding: 1rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #3b66e0, #1e3d9b);
            color: white;
            box-shadow: 0 10px 20px -10px #1e3d9b, 0 0 0 1px #5f8aff inset;
            flex: 2;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4a76f0, #2547b0);
            transform: scale(1.02);
            box-shadow: 0 14px 26px -8px #1e3d9b;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--reset-border);
            color: var(--reset-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            flex: 1;
        }

        .btn-reset:hover {
            background: var(--reset-hover-bg);
            border-color: var(--reset-hover-border);
            color: var(--reset-hover-color);
        }

        .message {
            margin-top: 1.2rem;
            font-size: 1rem;
            min-height: 2rem;
            color: #ffb86b;
            font-weight: 500;
            letter-spacing: 0.2px;
            padding-left: 0.5rem;
            transition: 0.15s;
        }

        .message.error {
            color: #ff6b7a;
        }

        .message.success {
            color: #6dedb0;
        }

        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            text-align: center;
            color: var(--footer-color);
            border-top: 1px solid var(--footer-border);
            padding-top: 1.5rem;
            letter-spacing: 0.8px;
            transition: all 0.3s ease;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .level-badge {
            animation: pulse 2s infinite alternate;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 顶部：网址 + 主题切换 + 标题区域 -->
        <div class="site-header">
            <div class="header-left">
                <div class="site-url">decryption.miller.com</div>
                <div class="theme-toggle" id="themeToggle" title="切换白天/夜间模式">🌙 夜间</div>
            </div>
            <div class="level-badge" id="levelDisplay">
                <span>Level</span> <span id="levelNumber">1</span>
            </div>
        </div>

        <!-- 题目区域 -->
        <div class="question-area">
            <div class="question-text" id="questionText">
                1
            </div>
        </div>

        <!-- 输入和操作区 -->
        <div class="input-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="输入正确答案..." autocomplete="off" autofocus>
            
            <div class="button-group">
                <button class="btn btn-reset" id="resetBtn">重置</button>
                <button class="btn btn-submit" id="submitBtn">提交 →</button>
            </div>
            <div class="message" id="message"></div>
        </div>

        <div class="footer-note">
            🔐 逐层解密 · 输入答案即可推进
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            //  关卡配置列表  ← 只需要改这里
            // ============================================================
            const LEVELS = [
                { question: "Please enter the answer:", answer: "answer" },
                { question: ":rewsna eht tupni esaelP", answer: "rewsna" },
                { question: "What's name?", answer: "name" },
                { question: "If the answer to this question is not unique, enter \"YE5\"; otherwise, enter \"N0\"", answer: "N0" },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem5.png' style='max-width:100%; height:auto;' alt='problem5'>", answer: "30" },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem6.png' style='max-width:100%; height:auto;' alt='problem6'>", answer: "MILLER" },
                { question: "[(4+2-9/3)*2]**(6^5)=?", answer: "216" },
                { question: "apple+orange=e\ndiding+doing=ding\nor+or=oror\nintervention+intention+(information+insertion)=?", answer: "intntion" },
                { question: "$$\n\\lceil\\lim_{n\\to\\infty}\\sum\\limits_{i=1}^{n}\\frac{8}{n^2}\\sqrt{i(n-i)}\\rceil=?\n$$", answer: "4" },
                { question: "Ho ar yo_u? I mr fin, _humthk you", answer: "we_are_human." },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem11.png' style='max-width:100%; height:auto;' alt='problem11'>", answer: "nnnand" },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem17.png' style='max-width:100%; height:auto;' alt='problem17'>", answer: "10" },
                { question: "有一首诗是这样的：\n----------------------\n回忆啊，  \n过去啊，  \n往日朵朵白云啊！\n\n云间亦有别：  \n积云厚，  \n而卷云飘渺，  \n掠过便无法忘怀。  \n时间的冲刷，  \n留下了些许残骸。\n\n回忆宛如入梦，  \n太过清楚则无法愉悦幻想，  \n太过模糊却坠入虚无。  \n只有  \n雾间山水、  \n纱下女子、  \n恰好的朦胧，  \n才能满足对美的苛求。\n\n回忆，\n将我裹进纸页里：\n分聚的朋友、\n推建的街道……\n种种线索让我出发，\n沿时间逆流而上。\n过去无法重来，\n我只是一个过客。\n但仍渴望在回忆中留下闲暇，\n在场景前驻足，\n在朦胧里瞭望，\n以此感受美好。\n时光流过身体，\n便心满意足。\n\n过去已然凝固，\n我与回忆向前。\n可因疏于保管，\n云也会有所改变，\n给回忆带来不少挑战。\n\n又能在何处倾诉？\n难言于知己。\n----------------------\n小觉也写了一首诗： \n---------------------- \n回思呀， \n昔去呀， \n清穹朵絮漫流呀！ \n \n天际自有异： \n积絮柔， \n风卷烟轻盈， \n相逢便刻于心间。 \n岁月在冲洗， \n留藏着零星痕迹。 \n \n浮忆好似酣眠， \n视界明了难滋生温柔遐想， \n轮廓虚糊便深陷空茫。 \n只余 \n烟间丘壑、 \n薄纱女容、 \n分寸的影像， \n才堪匹配心底里执念。 \n \n旧忆， \n尽数裹入信笺中： \n离合的伙伴、 \n蜿蜒的长巷…… \n万千踪迹引我远行， \n顺流年逆溯前行。 \n前尘无从再临， \n我本属人间行者。 \n但还是期许于旧景偷得清闲， \n于场隅间停驻， \n于朦雾中远眺， \n借此品赏温柔。 \n流光身边荡漾， \n就心自安然。 \n \n前尘早已凝定， \n我携旧事前行。 \n皆因轻在珍藏， \n流云自有些更迭， \n给旧事引出诸多困顿。 \n \n我该在哪处停留？ \n我问我自己。 \n---------------------- \n他自称与原文 0 重合。可他的朋友总感觉怪怪的，却不知道哪里出了问题。请你帮小觉的朋友写一份由 38 个小写英文字母组成的建议给小觉吧！（一定要一行一行看哦）", answer: "abcdabcdabkdabccabcccfdcaabbbbbeabdaee" }
            ];

            // ---------- 运行时状态 ----------
            let currentLevelIndex = 0;
            let isProcessing = false;

            // ---------- DOM 元素 ----------
            const questionTextDiv = document.getElementById('questionText');
            const answerInput     = document.getElementById('answerInput');
            const messageDiv      = document.getElementById('message');
            const themeToggle     = document.getElementById('themeToggle');

            // ---------- 主题切换逻辑 ----------
            // 读取本地保存的主题偏好，默认是夜间模式
            function loadTheme() {
                const saved = localStorage.getItem('decryption-theme');
                if (saved === 'light') {
                    document.body.classList.add('light-mode');
                    themeToggle.textContent = '☀️ 白天';
                } else {
                    document.body.classList.remove('light-mode');
                    themeToggle.textContent = '🌙 夜间';
                }
            }

            // 切换主题
            function toggleTheme() {
                if (document.body.classList.contains('light-mode')) {
                    document.body.classList.remove('light-mode');
                    themeToggle.textContent = '🌙 夜间';
                    localStorage.setItem('decryption-theme', 'dark');
                } else {
                    document.body.classList.add('light-mode');
                    themeToggle.textContent = '☀️ 白天';
                    localStorage.setItem('decryption-theme', 'light');
                }
            }

            // ---------- 辅助函数 ----------
            function updateLevelDisplay() {
                const span = document.getElementById('levelNumber');
                if (span) {
                    span.textContent = currentLevelIndex + 1;
                }
            }

            function updateQuestionText() {
                const level = LEVELS[currentLevelIndex];
                if (level) {
                    questionTextDiv.innerHTML = level.question.replace(/\n/g, '<br>');
                } else {
                    questionTextDiv.textContent = '🏁';
                }
            }

            function clearMessage() {
                messageDiv.textContent = '';
                messageDiv.classList.remove('error', 'success');
            }

            function setMessage(text, type = 'error') {
                messageDiv.textContent = text;
                messageDiv.classList.remove('error', 'success');
                if (type === 'error') {
                    messageDiv.classList.add('error');
                } else if (type === 'success') {
                    messageDiv.classList.add('success');
                }
            }

            function resetInputAndFocus() {
                answerInput.value = '';
                clearMessage();
                answerInput.focus();
            }

            function isGameComplete() {
                return currentLevelIndex >= LEVELS.length;
            }

            function handleSubmit() {
                if (isProcessing) return;

                if (isGameComplete()) {
                    setMessage('🎉 恭喜！你已经完成了所有关卡！点击「重置」重新开始。', 'success');
                    return;
                }

                const userAnswer = answerInput.value.trim();
                if (userAnswer === '') {
                    setMessage('⚠️ 请输入答案', 'error');
                    answerInput.focus();
                    return;
                }

                const expectedAnswer = LEVELS[currentLevelIndex].answer;
                if (userAnswer.toLowerCase() === expectedAnswer.toLowerCase()) {
                    isProcessing = true;
                    setMessage(`✓ 正确！进入 Level ${currentLevelIndex + 2} ...`, 'success');

                    const submitBtnNow = document.getElementById('submitBtn');
                    if (submitBtnNow) submitBtnNow.disabled = true;

                    setTimeout(() => {
                        currentLevelIndex++;

                        if (isGameComplete()) {
                            const levelDisplay = document.getElementById('levelDisplay');
                            levelDisplay.innerHTML = '<span>🏁</span> 通关';

                            answerInput.disabled = true;
                            answerInput.placeholder = '已通关';
                            setMessage('🏆 完美！你已解开所有层级。', 'success');
                            questionTextDiv.textContent = '🏁';
                            answerInput.blur();
                        } else {
                            answerInput.disabled = false;
                            answerInput.placeholder = '输入正确答案...';
                            updateLevelDisplay();
                            updateQuestionText();
                            resetInputAndFocus();
                            clearMessage();
                        }

                        isProcessing = false;
                        const submitBtnAfter = document.getElementById('submitBtn');
                        if (submitBtnAfter) submitBtnAfter.disabled = false;
                    }, 300);
                } else {
                    setMessage(`✗ 答案错误，再试试看`, 'error');
                    answerInput.select();
                }
            }

            function resetGame() {
                currentLevelIndex = 0;
                isProcessing = false;

                const levelDisplay = document.getElementById('levelDisplay');
                if (!document.getElementById('levelNumber')) {
                    levelDisplay.innerHTML = '<span>Level</span> <span id="levelNumber">1</span>';
                } else {
                    const span = document.getElementById('levelNumber');
                    if (span) span.textContent = '1';
                }

                answerInput.disabled = false;
                answerInput.placeholder = '输入正确答案...';

                updateQuestionText();
                resetInputAndFocus();
                clearMessage();

                const submitBtnNow = document.getElementById('submitBtn');
                if (submitBtnNow) submitBtnNow.disabled = false;
            }

            function init() {
                currentLevelIndex = 0;
                isProcessing = false;

                const levelDisplay = document.getElementById('levelDisplay');
                if (!document.getElementById('levelNumber')) {
                    levelDisplay.innerHTML = '<span>Level</span> <span id="levelNumber">1</span>';
                }

                answerInput.disabled = false;
                answerInput.placeholder = '输入正确答案...';

                updateQuestionText();
                updateLevelDisplay();
                resetInputAndFocus();
                clearMessage();

                const submitBtnNow = document.getElementById('submitBtn');
                if (submitBtnNow) submitBtnNow.disabled = false;
            }

            function bindEvents() {
                const oldSubmitBtn = document.getElementById('submitBtn');
                const newSubmitBtn = oldSubmitBtn.cloneNode(true);
                oldSubmitBtn.parentNode.replaceChild(newSubmitBtn, oldSubmitBtn);
                newSubmitBtn.addEventListener('click', handleSubmit);

                const oldResetBtn = document.getElementById('resetBtn');
                const newResetBtn = oldResetBtn.cloneNode(true);
                oldResetBtn.parentNode.replaceChild(newResetBtn, oldResetBtn);
                newResetBtn.addEventListener('click', resetGame);

                answerInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSubmit();
                    }
                });

                // 主题切换按钮
                themeToggle.addEventListener('click', toggleTheme);
            }

            // 启动
            loadTheme();
            init();
            bindEvents();

            window.resetGame = resetGame;
        })();
    </script>
</body>
</html>
