<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解密挑战 · Miller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(120, 180, 255, 0.15),
                        inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 160, 255, 0.2);
            transition: all 0.3s ease;
        }

        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .site-url {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: #7f8fa6;
            font-weight: 400;
            text-transform: lowercase;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            border: 1px solid #2a3448;
        }

        .level-badge {
            font-size: 1.25rem;
            font-weight: 700;
            color: #b7d0ff;
            background: linear-gradient(135deg, #1e2b4a, #0f1628);
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            border: 1px solid #3e5a8a;
            box-shadow: 0 0 12px rgba(80, 150, 255, 0.2);
            letter-spacing: 0.5px;
        }

        .level-badge span {
            color: #fff;
            font-weight: 800;
            margin-right: 6px;
            text-shadow: 0 0 8px #6ea8ff;
        }

        .question-area {
            background: #0b101b;
            border-radius: 1.8rem;
            padding: 2rem 2rem;
            margin: 1.5rem 0 2rem;
            border: 1px solid #26324a;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6), 0 8px 20px -8px black;
        }

        .question-text {
            color: #e8f0ff;
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.4;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #111826;
            border-radius: 1.5rem;
            padding: 1.8rem 1.5rem;
            border: 1px solid #2c3e5e;
            letter-spacing: 4px;
            text-shadow: 0 0 24px rgba(110, 168, 255, 0.5);
            word-break: break-word;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1.2rem;
        }

        .answer-input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            font-size: 1.2rem;
            background: #0d1422;
            border: 2px solid #26344e;
            border-radius: 60px;
            color: #e8f0ff;
            outline: none;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .answer-input::placeholder {
            color: #4e6180;
            font-weight: 400;
            font-style: italic;
        }

        .answer-input:focus {
            border-color: #4b7bec;
            box-shadow: 0 0 0 4px rgba(75, 123, 236, 0.25), 0 0 18px #1e3a8a;
            background: #0e1628;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn {
            border: none;
            padding: 1rem 2.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #3b66e0, #1e3d9b);
            color: white;
            box-shadow: 0 10px 20px -10px #1e3d9b, 0 0 0 1px #5f8aff inset;
            flex: 2;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4a76f0, #2547b0);
            transform: scale(1.02);
            box-shadow: 0 14px 26px -8px #1e3d9b;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid #2f405e;
            color: #9bb1d0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            flex: 1;
        }

        .btn-reset:hover {
            background: #1b2335;
            border-color: #4c6a97;
            color: #cddfff;
        }

        .message {
            margin-top: 1.2rem;
            font-size: 1rem;
            min-height: 2rem;
            color: #ffb86b;
            font-weight: 500;
            letter-spacing: 0.2px;
            padding-left: 0.5rem;
            transition: 0.15s;
        }

        .message.error {
            color: #ff6b7a;
        }

        .message.success {
            color: #6dedb0;
        }

        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            text-align: center;
            color: #3c4c66;
            border-top: 1px solid #1f2a3c;
            padding-top: 1.5rem;
            letter-spacing: 0.8px;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .level-badge {
            animation: pulse 2s infinite alternate;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 顶部：网址 + 标题区域 -->
        <div class="site-header">
            <div class="site-url">decryption.miller.com</div>
            <div class="level-badge" id="levelDisplay">
                <span>Level</span> <span id="levelNumber">1</span>
            </div>
        </div>

        <!-- 题目区域 -->
        <div class="question-area">
            <div class="question-text" id="questionText">
                1
            </div>
        </div>

        <!-- 输入和操作区 -->
        <div class="input-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="输入正确答案..." autocomplete="off" autofocus>
            
            <div class="button-group">
                <button class="btn btn-reset" id="resetBtn">重置</button>
                <button class="btn btn-submit" id="submitBtn">提交 →</button>
            </div>
            <div class="message" id="message"></div>
        </div>

        <div class="footer-note">
            🔐 逐层解密 · 输入答案即可推进
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            //  关卡配置列表  ← 只需要改这里
            //  每一项： { question: 题干, answer: 正确答案 }
            //  题目顺序就是关卡顺序（第 1 项是 Level 1，以此类推）
            // ============================================================
            const LEVELS = [
                { question: "Please enter the answer:", answer: "answer" },
                { question: ":rewsna eht tupni esaelP", answer: "rewsna" },
                { question: "What's name?", answer: "name" },
                { question: "If the answer to this question is not unique, enter \"YE5\"; otherwise, enter \"N0\"", answer: "N0" },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem5.png' style='max-width:100%; height:auto;' alt='problem5'>", answer: "30" },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem6.png' style='max-width:100%; height:auto;' alt='problem5'>", answer: "MILLER" },
                { question: "[(4+2-9/3)*2]**(6^5)=?", answer: "216" },
                { question: "apple+orange=e\ndiding+doing=ding\nor+or=oror\nintervention+intention+(information+insertion)=?", answer: "intntion" },
                { question: "$$\n\\lceil\\lim_{n\\to\\infty}\\sum\\limits_{i=1}^{n}\\frac{8}{n^2}\\sqrt{i(n-i)}\\rceil=?\n$$", answer: "4" },
                { question: "Ho ar yo_u? I mr fin, _humthk you", answer: "we_are_human." },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem11.png' style='max-width:100%; height:auto;' alt='problem5'>", answer: "nnnand" },
                { question: "<img src='https://raw.githubusercontent.com/Miller20140720/decryption/main/problem17.png' style='max-width:100%; height:auto;' alt='problem5'>", answer: "10" },
                { question: "有一首诗是这样的：\n----------------------\n回忆啊，  \n过去啊，  \n往日朵朵白云啊！\n\n云间亦有别：  \n积云厚，  \n而卷云飘渺，  \n掠过便无法忘怀。  \n时间的冲刷，  \n留下了些许残骸。\n\n回忆宛如入梦，  \n太过清楚则无法愉悦幻想，  \n太过模糊却坠入虚无。  \n只有  \n雾间山水、  \n纱下女子、  \n恰好的朦胧，  \n才能满足对美的苛求。\n\n回忆，\n将我裹进纸页里：\n分聚的朋友、\n推建的街道……\n种种线索让我出发，\n沿时间逆流而上。\n过去无法重来，\n我只是一个过客。\n但仍渴望在回忆中留下闲暇，\n在场景前驻足，\n在朦胧里瞭望，\n以此感受美好。\n时光流过身体，\n便心满意足。\n\n过去已然凝固，\n我与回忆向前。\n可因疏于保管，\n云也会有所改变，\n给回忆带来不少挑战。\n\n又能在何处倾诉？\n难言于知己。\n----------------------\n小觉也写了一首诗： \n---------------------- \n回思呀， \n昔去呀， \n清穹朵絮漫流呀！ \n \n天际自有异： \n积絮柔， \n风卷烟轻盈， \n相逢便刻于心间。 \n岁月在冲洗， \n留藏着零星痕迹。 \n \n浮忆好似酣眠， \n视界明了难滋生温柔遐想， \n轮廓虚糊便深陷空茫。 \n只余 \n烟间丘壑、 \n薄纱女容、 \n分寸的影像， \n才堪匹配心底里执念。 \n \n旧忆， \n尽数裹入信笺中： \n离合的伙伴、 \n蜿蜒的长巷…… \n万千踪迹引我远行， \n顺流年逆溯前行。 \n前尘无从再临， \n我本属人间行者。 \n但还是期许于旧景偷得清闲， \n于场隅间停驻， \n于朦雾中远眺， \n借此品赏温柔。 \n流光身边荡漾， \n就心自安然。 \n \n前尘早已凝定， \n我携旧事前行。 \n皆因轻在珍藏， \n流云自有些更迭， \n给旧事引出诸多困顿。 \n \n我该在哪处停留？ \n我问我自己。 \n---------------------- \n他自称与原文 0 重合。可他的朋友总感觉怪怪的，却不知道哪里出了问题。请你帮小觉的朋友写一份由 38 个小写英文字母组成的建议给小觉吧！（一定要一行一行看哦）", answer: "abcdabcdabkdabccabcccfdcaabbbbbeabdaee" }
            ];

            // ---------- 运行时状态 ----------
            let currentLevelIndex = 0;   // 当前关卡索引 (0-based)
            let isProcessing = false;    // 防止重复提交的锁

            // ---------- DOM 元素 ----------
            const questionTextDiv = document.getElementById('questionText');
            const answerInput     = document.getElementById('answerInput');
            const messageDiv      = document.getElementById('message');

            // ---------- 辅助函数 ----------
            // 更新关卡号显示 (Level 对应题号，从1开始)
            function updateLevelDisplay() {
                const span = document.getElementById('levelNumber');
                if (span) {
                    span.textContent = currentLevelIndex + 1;
                }
            }

            // 更新题干：从 LEVELS 列表里读取当前关卡的 question
            function updateQuestionText() {
    const level = LEVELS[currentLevelIndex];
    if (level) {
        // 把 \n 换成 <br>，再用 innerHTML 渲染，支持换行
        questionTextDiv.innerHTML = level.question.replace(/\n/g, '<br>');
    } else {
        questionTextDiv.textContent = '🏁';
    }
}

            // 清除消息
            function clearMessage() {
                messageDiv.textContent = '';
                messageDiv.classList.remove('error', 'success');
            }

            // 显示消息
            function setMessage(text, type = 'error') {
                messageDiv.textContent = text;
                messageDiv.classList.remove('error', 'success');
                if (type === 'error') {
                    messageDiv.classList.add('error');
                } else if (type === 'success') {
                    messageDiv.classList.add('success');
                }
            }

            // 重置输入框和消息，并聚焦
            function resetInputAndFocus() {
                answerInput.value = '';
                clearMessage();
                answerInput.focus();
            }

            // 检查是否通关（所有关卡完成）
            function isGameComplete() {
                return currentLevelIndex >= LEVELS.length;
            }

            // 提交答案逻辑 (带锁)
            function handleSubmit() {
                if (isProcessing) return;

                if (isGameComplete()) {
                    setMessage('🎉 恭喜！你已经完成了所有关卡！点击「重置」重新开始。', 'success');
                    return;
                }

                const userAnswer = answerInput.value.trim();
                if (userAnswer === '') {
                    setMessage('⚠️ 请输入答案', 'error');
                    answerInput.focus();
                    return;
                }

                const expectedAnswer = LEVELS[currentLevelIndex].answer;
                if (userAnswer.toLowerCase() === expectedAnswer.toLowerCase()) {
                    // 正确：上锁
                    isProcessing = true;
                    setMessage(`✓ 正确！进入 Level ${currentLevelIndex + 2} ...`, 'success');

                    // 禁用提交按钮防止重复点击
                    const submitBtnNow = document.getElementById('submitBtn');
                    if (submitBtnNow) submitBtnNow.disabled = true;

                    setTimeout(() => {
                        currentLevelIndex++;

                        if (isGameComplete()) {
                            // 通关
                            const levelDisplay = document.getElementById('levelDisplay');
                            levelDisplay.innerHTML = '<span>🏁</span> 通关';

                            answerInput.disabled = true;
                            answerInput.placeholder = '已通关';
                            setMessage('🏆 完美！你已解开所有层级。', 'success');
                            questionTextDiv.textContent = '🏁';
                            answerInput.blur();
                        } else {
                            // 下一关
                            answerInput.disabled = false;
                            answerInput.placeholder = '输入正确答案...';
                            updateLevelDisplay();
                            updateQuestionText();  // 从 LEVELS 读取新题号
                            resetInputAndFocus();
                            clearMessage();
                        }

                        // 解锁
                        isProcessing = false;
                        const submitBtnAfter = document.getElementById('submitBtn');
                        if (submitBtnAfter) submitBtnAfter.disabled = false;
                    }, 300);
                } else {
                    // 错误
                    setMessage(`✗ 答案错误，再试试看`, 'error');
                    answerInput.select();
                }
            }

            // 重置整个游戏
            function resetGame() {
                currentLevelIndex = 0;
                isProcessing = false;

                const levelDisplay = document.getElementById('levelDisplay');
                if (!document.getElementById('levelNumber')) {
                    levelDisplay.innerHTML = '<span>Level</span> <span id="levelNumber">1</span>';
                } else {
                    const span = document.getElementById('levelNumber');
                    if (span) span.textContent = '1';
                }

                answerInput.disabled = false;
                answerInput.placeholder = '输入正确答案...';

                updateQuestionText();  // 从 LEVELS 读取第 1 关题干
                resetInputAndFocus();
                clearMessage();

                const submitBtnNow = document.getElementById('submitBtn');
                if (submitBtnNow) submitBtnNow.disabled = false;
            }

            // 初始化页面
            function init() {
                currentLevelIndex = 0;
                isProcessing = false;

                const levelDisplay = document.getElementById('levelDisplay');
                if (!document.getElementById('levelNumber')) {
                    levelDisplay.innerHTML = '<span>Level</span> <span id="levelNumber">1</span>';
                }

                answerInput.disabled = false;
                answerInput.placeholder = '输入正确答案...';

                updateQuestionText();
                updateLevelDisplay();
                resetInputAndFocus();
                clearMessage();

                const submitBtnNow = document.getElementById('submitBtn');
                if (submitBtnNow) submitBtnNow.disabled = false;
            }

            // 绑定事件
            function bindEvents() {
                // 提交按钮（克隆替换，避免重复监听）
                const oldSubmitBtn = document.getElementById('submitBtn');
                const newSubmitBtn = oldSubmitBtn.cloneNode(true);
                oldSubmitBtn.parentNode.replaceChild(newSubmitBtn, oldSubmitBtn);
                newSubmitBtn.addEventListener('click', handleSubmit);

                // 重置按钮
                const oldResetBtn = document.getElementById('resetBtn');
                const newResetBtn = oldResetBtn.cloneNode(true);
                oldResetBtn.parentNode.replaceChild(newResetBtn, oldResetBtn);
                newResetBtn.addEventListener('click', resetGame);

                // 回车提交
                answerInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSubmit();
                    }
                });
            }

            // 启动
            init();
            bindEvents();

            // 暴露到全局，方便调试
            window.resetGame = resetGame;
        })();
    </script>
</body>
</html>
